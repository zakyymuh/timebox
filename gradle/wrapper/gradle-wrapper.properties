distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Back on the current line. The 9.5 pin existed only because AGP 8.13.2 uses
# org.gradle.api.problems.internal.InternalProblems, removed in Gradle 9.6.0 — and AGP 8
# is no longer an option, since androidx needs compileSdk 37 and AGP 9.1+.
# The working triple is Gradle 9.8.2 + AGP 9.4.1 + Kotlin 2.4.21.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.2-bin.zip
# The default 10s is far too short on a slow connection; the download is ~150 MB.
networkTimeout=180000
retries=3
retryBackOffMs=2000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
