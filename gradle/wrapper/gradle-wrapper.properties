distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Pinned to the 9.5 line on purpose, NOT the latest (9.8.2). Gradle 9.6.0 removed
# org.gradle.api.problems.internal.InternalProblems, which AGP 8.13.2 still uses:
#   Plugin 'com.android.internal.application' relies on ... InternalProblems,
#   a Gradle internal API that was removed in Gradle 9.6.0 ... or use Gradle 9.5
# And AGP 9.x cannot be used instead because it needs Kotlin 2.5.0-Beta.
# The working triple is Gradle 9.5.1 + AGP 8.13.2 + Kotlin 2.4.21.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
# The default 10s is far too short on a slow connection; the download is ~150 MB.
networkTimeout=180000
retries=3
retryBackOffMs=2000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
