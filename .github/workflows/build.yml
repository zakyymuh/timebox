name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # AGP 9 needs 21; modules still emit Java 17 bytecode

      - uses: gradle/actions/setup-gradle@v4

      # compileSdk 37 is required by androidx; the runner image may not ship that
      # platform yet. Idempotent, and non-fatal if it is already installed.
      - name: Ensure Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" || true

      # The rule set. Pure Kotlin, no Android SDK needed.
      - name: Test :core
        run: ./gradlew :core:test

      # The runner has the Android SDK at $ANDROID_HOME, which is also what
      # settings.gradle.kts keys the Android modules off.
      - name: Test the three apps
        if: hashFiles('app/build.gradle.kts') != ''
        run: ./gradlew :app:testDebugUnitTest :habits:testDebugUnitTest :motor:testDebugUnitTest

      - name: Build the three debug APKs
        if: hashFiles('app/build.gradle.kts') != ''
        run: ./gradlew :app:assembleDebug :habits:assembleDebug :motor:assembleDebug

      # Every app is signed with the committed app/debug.keystore, so each later build
      # installs over the last one. A different key would force an uninstall, which
      # deletes that app's data. Fail here rather than on the phone.
      - name: Check all three APKs share one signing key
        if: hashFiles('app/build.gradle.kts') != ''
        run: |
          signer="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for module in app habits motor; do
            "$signer" verify --print-certs "$module"/build/outputs/apk/debug/*.apk | grep 'SHA-256 digest'
          done | sort -u > digests.txt
          cat digests.txt
          test "$(wc -l < digests.txt)" -eq 1

      - name: Upload papacti (plants) APK
        if: hashFiles('app/build.gradle.kts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: plants-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Habits APK
        if: hashFiles('habits/build.gradle.kts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: habits-debug-apk
          path: habits/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Motor APK
        if: hashFiles('motor/build.gradle.kts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: motor-debug-apk
          path: motor/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Test reports are the only way to read a failure from here.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            habits/build/reports/tests/
            motor/build/reports/tests/
          if-no-files-found: ignore
