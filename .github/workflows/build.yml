name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The rule set. Pure Kotlin, no Android SDK needed.
      - name: Test :core
        run: ./gradlew :core:test

      # The runner has the Android SDK at $ANDROID_HOME, which is also what
      # settings.gradle.kts keys the :app module off.
      - name: Test :app
        if: hashFiles('app/build.gradle.kts') != ''
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        if: hashFiles('app/build.gradle.kts') != ''
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        if: hashFiles('app/build.gradle.kts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: timebox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Test reports are the only way to read a failure from here.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
